<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมกาก</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--card:#0f172a;--bd:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--gold:#f59e0b;--red:#ef4444;--blue:#3b82f6;--pt:env(safe-area-inset-top,0px);--pb:env(safe-area-inset-bottom,0px);box-sizing:border-box;padding-top:var(--pt);padding-bottom:var(--pb)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Kanit',system-ui,sans-serif;min-height:100%}
.wrap{max-width:1150px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px;color:var(--gold)}
.sub{color:var(--mut);font-size:.8rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}
.hidden{display:none!important}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text]{background:#0b1220;border:1px solid #334155;color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit;width:100%}
input[type=text]:focus{outline:0;border-color:var(--gold)}
#names{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:12px 0}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;transition:.15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
.gold{background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#111}
.ghost{background:#1e293b;color:#fcd34d;border:1px solid #f59e0b55}
.grid{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-top:4px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.slots{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:10px}
@media(max-width:560px){.slots{grid-template-columns:1fr}}
.reel{background:#050912;border:2px solid #334155;border-radius:16px;min-height:260px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;position:relative;overflow:hidden}
.reel .lbl{position:absolute;top:8px;left:12px;font-size:.65rem;letter-spacing:.12em;color:var(--mut)}
.reel.spin{border-color:var(--gold);box-shadow:0 0 18px #f59e0b55}
.reel.spin .val{animation:flick .12s infinite}
.reel.done{border-color:#10b981;box-shadow:0 0 22px #10b98177}
.reel.red.done{border-color:var(--red);box-shadow:0 0 26px #ef444488;background:#2a0c10}
.reel.blue.done{border-color:var(--blue);box-shadow:0 0 26px #3b82f688;background:#0b1a33}
@keyframes flick{0%{transform:translateY(-6px);opacity:.6}100%{transform:translateY(0);opacity:1}}
.val{font-size:2.3rem;line-height:1.1;font-weight:800;word-break:break-word}
.hero-img{width:136px;height:136px;border-radius:16px;object-fit:cover;border:2px solid var(--gold);background:#111827}
.bar{height:8px;background:#1e293b;border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#fde047)}
.phase{font-size:.8rem;color:var(--mut);min-height:1.2em}
.side h3{margin:0 0 8px;font-size:.95rem}
.team{margin-bottom:14px}
.team .hd{font-weight:700;font-size:.85rem;display:flex;justify-content:space-between;margin-bottom:6px}
.it{display:flex;align-items:center;gap:10px;background:#0b1220;border-radius:10px;padding:6px 8px;margin-bottom:6px;border-left:4px solid}
.it img{width:50px;height:50px;border-radius:8px;object-fit:cover;background:#111827}
.it b{display:block;font-size:1.1rem}.it span{font-size:.95rem;color:var(--mut)}
.it.new{animation:pop .6s}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.R .it{border-color:var(--red)}.B .it{border-color:var(--blue)}
.R .hd{color:#fca5a5}.B .hd{color:#93c5fd}
.empty{font-size:.75rem;color:#64748b;font-style:italic}
#snd{background:#1e293b;color:var(--tx);padding:6px 12px;font-size:.75rem}
.sum-head{text-align:center;margin:6px 0 16px}
.sum-head h2{margin:0 0 4px;color:var(--gold);font-size:1.6rem}
.sumteam{margin-bottom:18px;border-radius:18px;overflow:hidden;border:1px solid var(--bd);background:var(--card)}
.sumhd{display:flex;justify-content:space-between;padding:12px 18px;font-weight:800;font-size:1.1rem;color:#fff}
.sumteam.R .sumhd{background:#b91c1c}.sumteam.B .sumhd{background:#1d4ed8}
.sumteam.R{border-color:#ef444466}.sumteam.B{border-color:#3b82f666}
.cards{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pc{background:#0b1220;border:1px solid #334155;border-radius:14px;padding:8px;text-align:center;animation:pop .5s both}
.pc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#111827;display:block}
.pc span.pn{display:block;margin-top:8px;font-size:1.55rem;font-weight:800;line-height:1.1;color:#fff;word-break:break-word}
.pc b{display:block;margin-top:4px;font-size:1.1rem;line-height:1.1;color:var(--gold);font-weight:600}
.sum-btns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.sel{display:flex;align-items:center;gap:8px;background:#0b1220;border:1px solid #334155;border-radius:10px;padding:4px 8px}
.sel input[type=checkbox]{width:18px;height:18px;accent-color:#f59e0b;flex:none}
.sel input[type=text]{border:0;background:transparent;padding:6px 4px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:2px solid;cursor:pointer;font-weight:700;user-select:none}
.chip.r{border-color:#ef4444;color:#fca5a5}.chip.b{border-color:#3b82f6;color:#93c5fd}
.chip input{width:18px;height:18px}
.chip.r input{accent-color:#ef4444}.chip.b input{accent-color:#3b82f6}
.hint{font-size:.75rem;color:var(--mut);margin-top:-6px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
 <div class="row" style="justify-content:space-between"><div><h1> เกมกาก</h1><div class="sub">ฮีโร่ <span id="hc">120</span> ตัว · </div></div><button id="snd">🔊 เสียง: เปิด</button></div>

 <section id="setup" class="card">
  <div class="row"><label>จำนวนผู้เล่น: <b id="nb">6</b></label><input type="range" id="np" min="1" max="10" value="6" style="flex:1;min-width:160px;accent-color:#f59e0b"></div>
  <div class="hint">ติ๊กเลือกคนที่จะสุ่ม (ไม่ติ๊ก = ไม่เข้าสุ่ม) และเลือกทีมที่จะให้ออก</div>
  <div id="names"></div>
  <div class="row" style="margin:4px 0 14px"><b>ทีมที่สุ่ม:</b>
   <label class="chip r"><input type="checkbox" id="tr" checked> 🔴 ทีมแดง</label>
   <label class="chip b"><input type="checkbox" id="tb" checked> 🔵 ทีมฟ้า</label></div>
  <div class="row"><button class="gold" id="go"> เริ่มสุ่มทีละคน</button><button class="ghost" id="goall"> สุ่มทั้งหมดทันที</button></div>
 </section>

 <section id="stage" class="hidden">
  <div class="grid">
   <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><b id="prog">ผู้เล่น 0 / 0</b><span class="phase" id="phase">กดปุ่มเพื่อเริ่มสุ่ม</span></div>
    <div class="slots">
     <div class="reel" id="r1"><span class="lbl">ผู้เล่น</span><div class="val" id="v1">?</div></div>
     <div class="reel" id="r2"><span class="lbl">ฝั่งทีม</span><div class="val" id="v2">?</div></div>
     <div class="reel" id="r3"><span class="lbl">ฮีโร่</span><img class="hero-img hidden" id="hi" referrerpolicy="no-referrer" alt=""><div class="val" id="v3">?</div></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="row" style="justify-content:space-between;margin-top:12px">
     <button class="ghost" id="back">⬅ ตั้งค่าใหม่</button>
     <div class="row"><button class="ghost" id="inst"> สุ่มทั้งหมดทันที</button><button class="gold" id="next"> เริ่มสุ่มคนถัดไป</button></div>
    </div>
   </div>
   <div class="card side">
    <h3> ผลการสุ่ม (Real-time)</h3>
    <div class="team R"><div class="hd"><span>🔴 RED TEAM</span><span id="rc">0</span></div><div id="rl"></div></div>
    <div class="team B"><div class="hd"><span>🔵 BLUE TEAM</span><span id="bc">0</span></div><div id="bl"></div></div>
   </div>
  </div>
 </section>
 <section id="summary" class="hidden">
  <div class="sum-head"><h2>ทีมที่สมดุล</h2><div class="sub">ผลการสุ่มทั้งหมด</div></div>
  <div class="sumteam R"><div class="sumhd"><span>🔴 RED TEAM</span><span id="sr-n"></span></div><div class="cards" id="sr"></div></div>
  <div class="sumteam B"><div class="sumhd"><span>🔵 BLUE TEAM</span><span id="sb-n"></span></div><div class="cards" id="sb"></div></div>
  <div class="sum-btns"><button class="ghost" id="copy"> คัดลอกผลลัพธ์</button><button class="gold" id="again"> เริ่มสุ่มใหม่</button></div>
 </section>
</div>

const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const T_PLAYER=2000,T_TEAM=3000,T_HERO=4500;
const USED=new Set();let S=null,timers=[],snd=true,ac=null;

function tick(f=500,d=.04,v=.05){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
$('snd').onclick=()=>{snd=!snd;$('snd').textContent=' เสียง: '+(snd?'เปิด':'ปิด')};

function names(){const n=+$('np').value;$('nb').textContent=n;const c=$('names'),old=[...c.querySelectorAll('.sel')].map(d=>[d.querySelector('input[type=text]').value,d.querySelector('input[type=checkbox]').checked]);c.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('label');d.className='sel';const k=document.createElement('input');k.type='checkbox';k.checked=old[i]?old[i][1]:true;const e=document.createElement('input');e.type='text';e.value=old[i]?old[i][0]:'ผู้เล่น '+(i+1);d.append(k,e);c.appendChild(d)}}
$('np').oninput=names;names();

function left(){$('hc').textContent=(HEROES.length-USED.size)+' / '+HEROES.length+' (ยังไม่ถูกสุ่ม)'}
function freshPool(n){let p=HEROES.filter(h=>!USED.has(h.n));if(p.length<n){USED.clear();p=[...HEROES];alert('ฮีโร่เหลือไม่พอ จึงเริ่มรอบใหม่ทั้ง '+HEROES.length+' ตัว')}return p}
function start(instant){
  const pl=[...document.querySelectorAll('#names .sel')].filter(d=>d.querySelector('input[type=checkbox]').checked).map((d,i)=>d.querySelector('input[type=text]').value.trim()||'ผู้เล่น '+(i+1));
  const useR=$('tr').checked,useB=$('tb').checked;
  if(!pl.length){alert('กรุณาติ๊กเลือกผู้เล่นอย่างน้อย 1 คน');return}
  if(!useR&&!useB){alert('กรุณาเลือกทีมอย่างน้อย 1 ทีม');return}
  const n=pl.length,half=Math.floor(n/2);
  let nr;
  if(useR&&useB){const redExtra=Math.random()<.5;nr=n%2?(redExtra?half+1:half):half}else nr=useR?n:0;
  const teams=shuf([...Array(nr).fill('R'),...Array(n-nr).fill('B')]);
  const tset=useR&&useB?['R','B']:[useR?'R':'B'];
  S={all:pl,tset,left:shuf(pl),teams,pool:shuf(freshPool(n)),res:[],busy:false,cur:null,max:{R:nr,B:n-nr}};
  document.querySelector('.team.R').classList.toggle('hidden',!useR);document.querySelector('.team.B').classList.toggle('hidden',!useB);
  document.querySelector('.sumteam.R').classList.toggle('hidden',!useR);document.querySelector('.sumteam.B').classList.toggle('hidden',!useB);
  HEROES.forEach(h=>setImg(new Image(),h));
  $('setup').classList.add('hidden');$('stage').classList.remove('hidden');
  resetReels();side();
  if(instant)finishAll();
}
function resetReels(){['r1','r2','r3'].forEach(r=>$(r).className='reel');$('v1').textContent='?';$('v2').textContent='?';$('v3').textContent='?';$('hi').classList.add('hidden');$('bar').style.width='0';$('phase').textContent='กดปุ่มเพื่อเริ่มสุ่ม'}
function teamTxt(t){return t==='R'?'🔴 RED TEAM':'🔵 BLUE TEAM'}
function pick(){const p=S.left.pop(),t=S.teams.pop(),h=S.pool.pop();USED.add(h.n);left();return{p,t,h}}
function cands(h){const u=h.u,o=u.replace(/thumb\/(\w\/\w\w\/[^/]+)\/[^/]+$/,'$1');const px=x=>'https://wsrv.nl/?url='+encodeURIComponent(x);return[...new Set([u,o,px(u),px(o)])]}
function setImg(img,h,fail){const c=cands(h);let k=0;img.referrerPolicy='no-referrer';img.onerror=()=>{k++;if(k<c.length)img.src=c[k];else fail&&fail()};img.src=c[0]}
function showHero(h){const i=$('hi');i.classList.remove('hidden');setImg(i,h,()=>i.classList.add('hidden'));$('v3').textContent=h.n;$('v3').style.fontSize='1.8rem'}

function rollNext(){
  if(S.busy||!S.left.length)return;
  S.busy=true;const c=S.cur=pick();
  const poolP=[c.p,...S.left],poolT=[...new Set([c.t,...S.teams])];
  $('next').disabled=true;resetReels();
  ['r1','r2','r3'].forEach(r=>$(r).classList.add('spin'));
  const t0=performance.now();
  const iv=setInterval(()=>{
    const e=performance.now()-t0;
    $('bar').style.width=Math.min(100,e/T_HERO*100)+'%';
    if(e<T_PLAYER){$('v1').textContent=rnd(poolP);$('phase').textContent='กำลังสุ่มผู้เล่น...'}
    if(e<T_TEAM){const t=rnd(poolT);$('v2').textContent=teamTxt(t)}
    if(e<T_HERO&&e>=T_TEAM-0){}
    if(e<T_HERO){const h=rnd(HEROES);showHero(h)}
    if(e<T_PLAYER||e<T_TEAM||e<T_HERO)tick(300+Math.random()*400,.03,.025);
  },90);
  timers.push(iv);
  const stop=(ms,fn)=>timers.push(setTimeout(fn,ms));
  stop(T_PLAYER,()=>{$('v1').textContent=c.p;$('r1').className='reel done';tick(700,.2,.1);$('phase').textContent='กำลังสุ่มฝั่งทีม...'});
  stop(T_TEAM,()=>{$('v2').textContent=teamTxt(c.t);$('r2').className='reel done '+(c.t==='R'?'red':'blue');tick(800,.2,.1);$('phase').textContent='กำลังสุ่มฮีโร่...'});
  stop(T_HERO,()=>{clearInterval(iv);showHero(c.h);$('r3').className='reel done';$('bar').style.width='100%';tick(1046,.45,.12);commit()});
}
function commit(){
  const c=S.cur;if(!c)return;S.res.push(c);S.cur=null;S.busy=false;timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];
  side(c);
  const done=!S.left.length;
  $('next').disabled=done;
  $('phase').textContent=done?' สุ่มครบทุกคนแล้ว':'พร้อมสุ่มคนถัดไป';
  $('next').textContent=done?' เสร็จสิ้น':' เริ่มสุ่มคนถัดไป';
  if(done)scheduleSummary(2200);
}
function finishAll(){
  timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];
  if(S.cur){const c=S.cur;$('v1').textContent=c.p;$('v2').textContent=teamTxt(c.t);showHero(c.h);commit()}
  let last=null;
  while(S.left.length){const c=pick();S.res.push(c);last=c}
  S.busy=false;
  if(last){$('v1').textContent=last.p;$('v2').textContent=teamTxt(last.t);showHero(last.h);
    $('r1').className='reel done';$('r2').className='reel done '+(last.t==='R'?'red':'blue');$('r3').className='reel done'}
  side();$('next').disabled=true;$('next').textContent=' เสร็จสิ้น';$('phase').textContent=' สุ่มครบทุกคนแล้ว!';$('bar').style.width='100%';tick(1046,.45,.12);scheduleSummary(700);
}
function side(newest){
  const tot=S.all.length;$('prog').textContent=`ผู้เล่น ${S.res.length} / ${tot}`;
  for(const t of['R','B']){
    const box=$(t==='R'?'rl':'bl'),list=S.res.filter(r=>r.t===t);
    $(t==='R'?'rc':'bc').textContent=`${list.length}/${S.max[t]}`;
    box.innerHTML=list.length?'':'<div class="empty">ยังไม่มีผู้เล่น...</div>';
    list.forEach(r=>{const d=document.createElement('div');d.className='it'+(r===newest?' new':'');
      const im=document.createElement('img');im.alt='';setImg(im,r.h,()=>{im.style.visibility='hidden'});
      const x=document.createElement('div');x.innerHTML='<b></b><span></span>';x.firstChild.textContent=r.h.n;x.lastChild.textContent=r.p;
      d.append(im,x);box.appendChild(d)});
  }
}
left();
$('go').onclick=()=>start(false);
$('goall').onclick=()=>start(true);
$('next').onclick=rollNext;
$('inst').onclick=()=>{if(S)finishAll()};
$('back').onclick=()=>{clearTimeout(sumT);$('summary').classList.add('hidden');timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];S=null;$('next').disabled=false;$('next').textContent=' เริ่มสุ่มคนถัดไป';$('stage').classList.add('hidden');$('setup').classList.remove('hidden')};
let sumT=null;
function showSummary(){
  if(!S||S.left.length||S.busy)return;
  for(const t of['R','B']){
    const box=$(t==='R'?'sr':'sb'),list=S.res.filter(r=>r.t===t);box.innerHTML='';
    $(t==='R'?'sr-n':'sb-n').textContent=list.length+' คน';
    if(!list.length)box.innerHTML='<div class="empty">ไม่มีผู้เล่น</div>';
    list.forEach((r,i)=>{const d=document.createElement('div');d.className='pc';d.style.animationDelay=i*.08+'s';
      const im=document.createElement('img');im.alt=r.h.n;setImg(im,r.h,()=>{im.style.visibility='hidden'});
      const b=document.createElement('b'),sp=document.createElement('span');b.textContent=r.h.n;sp.textContent=r.p;
      sp.className='pn';d.append(im,sp,b);box.appendChild(d)});
  }
  $('stage').classList.add('hidden');$('summary').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});
}
function scheduleSummary(ms){clearTimeout(sumT);sumT=setTimeout(showSummary,ms)}
$('again').onclick=()=>$('back').onclick();
$('copy').onclick=()=>{
  const f=t=>S.res.filter(r=>r.t===t).map(r=>r.p+' — '+r.h.n).join('\n');
  const txt='🔴 RED TEAM\n'+f('R')+'\n\n🔵 BLUE TEAM\n'+f('B');
  const b=$('copy');const ok=()=>{b.textContent=' คัดลอกแล้ว';setTimeout(()=>b.textContent=' คัดลอกผลลัพธ์',1500)};
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(ok).catch(()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()});
};
</script>
